# ──────────────────────────────────────────────────────────────────────────────
# CI pipeline — runs on every pull-request event (open, update, reopen)
#
# Jobs
#   lint  →  ruff (style + format) · mypy (type checking)
#   test  →  pytest matrix (Python 3.11, 3.12) with JUnit XML + coverage
#   build →  wheel + sdist via python -m build  [runs only when source changed]
#
# Branch protection (enable in repo Settings → Branches):
#   Required status checks:  "Lint & type-check"
#                            "Test / Python 3.11"
#                            "Test / Python 3.12"
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same ref when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read        # checkout
  checks:   write       # test-reporter needs this to post check annotations
  pull-requests: write  # allows test-reporter to add PR comments

jobs:

  # ── 1. Lint & static analysis ───────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff — lint
        run: ruff check src/ tests/

      - name: Ruff — format check
        run: ruff format --check src/ tests/

      # mypy runs with strict=false / ignore_missing_imports=true (pyproject.toml).
      # continue-on-error keeps the PR unblocked while typing is still evolving,
      # but the result is still visible as a ✗ annotation on the check.
      - name: Mypy — type check
        run: mypy src/
        continue-on-error: true

  # ── 2. Tests (matrix across supported Python versions) ─────────────────────
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false          # report failures on both versions independently
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest \
            --cov=src \
            --cov-report=xml:coverage-py${{ matrix.python-version }}.xml \
            --junitxml=test-results-py${{ matrix.python-version }}.xml

      # Publishes test results as a named check on the PR so failures
      # are visible inline — works for PRs from the same repo.
      # Note: fork PRs cannot write checks (GitHub security model); results
      #       are still available via the uploaded artifacts below.
      - name: Publish test results to PR
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Test Results — Python ${{ matrix.python-version }}"
          path: "test-results-py${{ matrix.python-version }}.xml"
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.xml
          retention-days: 7

  # ── 3. Build (wheel + sdist) — only when source or config changes ───────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    # Only build when source code or packaging config actually changed
    if: |
      github.event_name == 'pull_request' && (
        contains(github.event.pull_request.changed_files, 'src/') ||
        contains(github.event.pull_request.changed_files, 'pyproject.toml')
      )

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
