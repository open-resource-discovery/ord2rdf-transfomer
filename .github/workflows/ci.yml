# ──────────────────────────────────────────────────────────────────────────────
# CI pipeline — runs on every pull-request event (open, update, reopen)
#
# Jobs
#   lint  →  ruff (style + format) · mypy (type checking)
#   test  →  pytest matrix (Python 3.11, 3.12) with JUnit XML + coverage
#   build →  wheel + sdist via python -m build
#
# Branch protection (enable in repo Settings → Branches):
#   Required status checks:  "Lint & type-check"
#                            "Test / Python 3.11"
#                            "Test / Python 3.12"
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same ref when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  # ── 1. Lint & static analysis ───────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.9
          enable-cache: false
      - name: Install dev dependencies
        run: uv sync --locked --extra dev

      - name: Ruff — lint
        run: uv run --locked --extra dev ruff check src/ tests/

      - name: Ruff — format check
        run: uv run --locked --extra dev ruff format --check src/ tests/

      - name: Mypy — type check
        run: uv run --locked --extra dev mypy src/

  # ── 2. Tests (matrix across supported Python versions) ─────────────────────
  test:
    permissions:
      contents: read
      checks: write
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false # report failures on both versions independently
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.9
          enable-cache: false
      - name: Install package + dev dependencies
        run: uv sync --locked --extra dev

      - name: Run pytest
        run: |
          uv run --locked --extra dev pytest \
            --cov=src \
            --cov-report=xml:coverage-py${{ matrix.python-version }}.xml \
            --junitxml=test-results-py${{ matrix.python-version }}.xml

      # Publishes test results as a named check on the PR so failures
      # are visible inline — works for PRs from the same repo.
      # Note: fork PRs cannot write checks (GitHub security model); results
      #       are still available via the uploaded artifacts below.
      - name: Publish test results to PR
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: "Test Results — Python ${{ matrix.python-version }}"
          path: "test-results-py${{ matrix.python-version }}.xml"
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.xml
          retention-days: 7

  # ── 3. Build (wheel + sdist) ───────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.9
          enable-cache: false
      - name: Install build backend
        run: uv sync --locked --group build

      - name: Build wheel and sdist
        run: uv run --locked --group build python -m build --no-isolation

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7
