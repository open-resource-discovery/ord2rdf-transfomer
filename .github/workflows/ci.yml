# ──────────────────────────────────────────────────────────────────────────────
# CI pipeline — runs on every pull-request event (open, update, reopen)
#
# Jobs
#   lint  →  ruff (style + format) · mypy (type checking)
#   test  →  pytest matrix (Python 3.11, 3.12) with JUnit XML + coverage
#   build →  wheel + sdist via python -m build
#
# Branch protection (enable in repo Settings → Branches):
#   Required status checks:  "Lint & type-check"
#                            "Test / Python 3.11"
#                            "Test / Python 3.12"
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same ref when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  # ── 1. Lint & static analysis ───────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7
        with:
          python-version: "3.12"
      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.9
          enable-cache: false
      - name: Install dev dependencies
        run: uv sync --locked --extra dev

      - name: Ruff — lint
        run: uv run --locked --extra dev ruff check src/ tests/

      - name: Ruff — format check
        run: uv run --locked --extra dev ruff format --check src/ tests/

      - name: Mypy — type check
        run: uv run --locked --extra dev mypy src/

  # ── 2. Tests (matrix across supported Python versions) ─────────────────────
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false # report failures on both versions independently
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.9
          enable-cache: false
      - name: Install package + dev dependencies
        run: uv sync --locked --extra dev

      - name: Run pytest
        run: |
          uv run --locked --extra dev pytest \
            --cov=src \
            --cov-report=xml:coverage-py${{ matrix.python-version }}.xml \
            --junitxml=test-results-py${{ matrix.python-version }}.xml

      - name: Upload coverage report
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.xml
          retention-days: 7

      # ── 3. Build (wheel + sdist) ───────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results-py${{ matrix.python-version }}.xml
          retention-days: 7
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7
        with:
          python-version: "3.12"
      - name: Set up locked Python tooling
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.9
          enable-cache: false
      - name: Install build backend
        run: uv sync --locked --group build

      - name: Build wheel and sdist
        run: uv run --locked --group build python -m build --no-isolation

      - name: Upload build artifacts
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
