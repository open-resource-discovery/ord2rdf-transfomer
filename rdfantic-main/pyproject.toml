[build-system]
    requires = ["hatchling<1.32"]
    build-backend = "hatchling.build"

[project]
    name = "bkg-rdfantic"
    version = "0.2.0"
    description = "RDFantic - tool to serialize RDF artifacts from Pydantic models"
    authors = [{"name" = "SAP SE"}]
    readme = "README.md"
    requires-python = ">=3.12"
    classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Developers",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Typing :: Typed",
    ]

    dependencies = [
        "pydantic~=2.13.4",
        "pyshacl~=0.40.1",
        "rdflib~=7.6.0",
    ]

    [project.urls]
        homepage = "https://github.tools.sap/DL-COE/bkg-rdfantic"
        repository = "https://github.tools.sap/DL-COE/bkg-rdfantic"
        documentation = "https://github.tools.sap/DL-COE/bkg-rdfantic"

[dependency-groups]
    dev = [
        "ruff~=0.15.14",
        "pre-commit~=4.6.0",
        "ipykernel~=7.3.0",
    ]

    test = [
        "pytest~=9.0.0",
        "pytest-cov~=7.1.0",
        "pytest-asyncio~=1.3.0",
        "pytest-xdist~=3.8.0",
    ]

[tool.uv]
    package = true
    required-version = ">=0.6.0"
    default-groups = ['dev', 'test']

[tool.hatch]
    [tool.hatch.build]
        [tool.hatch.build.targets]
            [tool.hatch.build.targets.sdist]
                include = [
                    '/README.md',
                    '/pyproject.toml',
                    '/src',
                ]

            [tool.hatch.build.targets.wheel]
                packages = ["src/rdfantic"]

[tool.coverage]
    [tool.coverage.run]
        branch = true
        source = [
            "src/rdfantic",
        ]
        omit = [
            "*/__init__.py",
            "*/__main__.py",
            "*/tests/*",
        ]

    [tool.coverage.report]
        show_missing = true
        exclude_also = [
            "def __repr__",
            "raise AssertionError",
            "raise NotImplementedError",
            "if __name__ == .__main__.:",
            "if TYPE_CHECKING:",
            "class .*\\bProtocol\\):",
            "@(abc\\.)?abstractmethod",
        ]

[tool.pytest.ini_options]
    addopts = "-vv "
    asyncio_mode="auto"
    pythonpath=["."]

[tool.ruff]
    line-length = 120
    indent-width = 4
    target-version = "py312" # Assume Python 3.12

    exclude = [
        # Exclude a variety of commonly ignored directories.
        ".bzr",
        ".direnv",
        ".eggs",
        ".git",
        ".git-rewrite",
        ".hg",
        ".ipynb_checkpoints",
        ".mypy_cache",
        ".nox",
        ".pants.d",
        ".pyenv",
        ".pytest_cache",
        ".pytype",
        ".ruff_cache",
        ".svn",
        ".tox",
        ".venv",
        ".vscode",
        "__pypackages__",
        "_build",
        "buck-out",
        "build",
        "dist",
        "site-packages",
        "venv",

        # Exclude project-specific directories
        "docs/*",
    ]

    [tool.ruff.lint]
        select = [
            'A', # flake8-builtins
            'B', # flake8-bugbear
            'D', # pydocstyle
            'E', 'W', # pycodestyle
            'EXE', # flake8-executable
            'F', # pyflakes
            'G', # flake8-logging-format
            'I', # isort (imports)
            'LOG', # flake8-logging
            'N', # pep8-naming
            'PLC', 'PLE', 'PLR', 'PLW', # pylint
            'T10', # flake8-debugger
            'T20', # flake8-print
            'UP', # pyupgrade
            ]
        ignore = [
            "E501", # Line too long: handled by formatting if possible
        ]
        isort.split-on-trailing-comma = false
        pylint.max-args = 8

        # Relax specific rules inside test directories
        [tool.ruff.lint.per-file-ignores]
            "tests/*" = [
                "S101",  # Allow standard `assert` statements (Bandit rule S101 flags asserts by default)
                "SLF001", # Allow accessing private members in tests if needed
                "PLR2004", # Magic value used in comparison: fine in unit tests
                "D100", # Missing docstring in public module: tests don't need module docstrings
                "D101", # Missing docstring in public class: test classes are self-explanatory
                "D102", # Missing docstring in public method: test methods are self-explanatory
                "D103", # Missing docstring in public function: test functions are self-explanatory
                "D104", # Missing docstring in public package: test packages don't need docstrings
                "D106", # Missing docstring in public nested class: test nested classes don't need docstrings
                "E731", # Lambda assignment: common pattern in test Meta classes
                "B007", # Loop control variable not used: common in RDF triple iteration where only subject is needed
                "F841", # Local variable assigned but never used: test setup code
                "PLR0915", # Too many statements: comprehensive test methods
            ]

        [tool.ruff.lint.pydocstyle]
            convention = "numpy"  # Enforce NumPy-style sections: Parameters, Returns, Raises, Examples

    [tool.ruff.format]
        line-ending = "lf" # Use `\n` line endings for all files
