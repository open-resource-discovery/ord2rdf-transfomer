repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-json
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.14
  hooks:
    # Run the linter.
    - id: ruff
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the linter in check mode (no fixes, just report).
    - id: ruff
      name: ruff-check
      types_or: [ python, pyi ]
      args: [ --no-fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]
